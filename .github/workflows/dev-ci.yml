name: CI/CD (dev branch)

on:
  push:
    branches:
      - dev

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm run test

  docker-build:
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        run: |
          docker build -t ghcr.io/${{ github.repository }}/safety-ai-report:dev .
          docker push ghcr.io/${{ github.repository }}/safety-ai-report:dev

  deploy-staging:
    runs-on: ubuntu-latest
    needs: docker-build

    steps:
      - name: Checkout infra repo
        uses: actions/checkout@v4
        with:
          repository: your-org/safety-ai-report-infra
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy to Kubernetes (staging)
        run: |
          kubectl set image deployment/safety-ai-report \
            safety-ai-report=ghcr.io/${{ github.repository }}/safety-ai-report:dev
